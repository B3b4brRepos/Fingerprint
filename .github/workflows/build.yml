name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The fake ColorOS fingerprint: the patcher on the real method shapes, and a check that
  # its helper never names anything of the phone's (HAL, gatekeeper, weaver, keystore).
  fingerprint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fake fingerprint patcher and helper
        run: python3 -I scripts/test-fake-fingerprint.py
      - name: Shell scripts parse
        run: |
          bash -n scripts/make-overlays.sh
          bash -n switcher/assets/guest_props.sh

  # OneOS Probe needs nothing outside this repository (README, "Building from source").
  # The full OneOS app needs the overlay sets built from the ROM images, which are not in
  # the repository, so it is not built here.
  probe-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The runner image already has the Android SDK ($ANDROID_HOME) and its sdkmanager.
      # Accept the licenses; the platform (compileSdk release(37)) is fetched by the Android
      # Gradle Plugin if it is missing. Trying the two package names first only saves time:
      # a name this sdkmanager does not know is not an error here.
      - name: Android SDK licenses and platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-37.0" || "$SDKM" "platforms;android-37" || echo "platform 37 left to Gradle"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      # The app's SESL libraries come from tribalfs' GitHub Packages repo, which answers 401
      # without a login (app-android/settings.gradle.kts reads these two variables). The
      # repository's own GITHUB_TOKEN cannot read another account's packages: use a personal
      # access token (classic, scope read:packages) saved as the secret Ducksd.
      - name: Check the packages token
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.Ducksd }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::Add a repository secret Ducksd (a classic personal access token with read:packages): Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Build OneOS Probe (debug)
        working-directory: app-android
        env:
          GH_PACKAGES_USER: ${{ github.repository_owner }}
          GH_PACKAGES_TOKEN: ${{ secrets.Ducksd }}
        run: |
          chmod +x gradlew
          ./gradlew --max-workers=3 assembleProbeDebug
      - uses: actions/upload-artifact@v4
        with:
          name: oneos-probe-debug-apk
          path: app-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
